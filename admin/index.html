<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Coaches back office</title><link rel="stylesheet" href="../style.css"><script src="../config.js"></script>
<style>.wrap{padding:24px 16px}table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{cursor:pointer;white-space:nowrap}select.s{width:auto;padding:4px;margin:0}.tw{overflow-x:auto}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.bar input,.bar select{width:auto;margin:0}#login{max-width:340px}.hide{display:none!important}
.lockbtn{position:fixed;top:12px;right:12px;z-index:50;background:#C62828!important;color:#fff!important;border:0!important;box-shadow:0 2px 8px rgba(0,0,0,.25)}.lockbtn:hover{background:#A31515!important}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;font-size:.75rem}.cal .h{font-weight:700;text-align:center}.cal .c{background:var(--bg2);border:1px solid var(--line);border-radius:8px;min-height:90px;padding:4px;overflow:hidden}.cal .c.o{opacity:.4}.cal .c>b{display:block}
.ev{display:block;width:100%;text-align:left;font:inherit;border:0;border-left:4px solid var(--ac);background:#f6f0d8;border-radius:4px;padding:2px 4px;margin-top:3px;cursor:pointer;color:#111}.ev.requested{border-left-color:#bbb;background:#f2f2f2}.ev.blk{border-left-color:#111;background:#eee;cursor:default}.ev u{text-decoration:none;color:var(--mut)}.cal.week .c{min-height:300px}
dialog{border:1px solid var(--line);border-radius:14px;max-width:420px;width:92vw}dialog::backdrop{background:rgba(0,0,0,.35)}.ev{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ev small{display:block;overflow:hidden;text-overflow:ellipsis;color:var(--mut)}.cal .c.today>b{background:var(--ac);border-radius:99px;padding:0 6px;display:inline-block}
.cal.mini{gap:3px}.cal.mini .c{min-height:48px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;color:#111;cursor:pointer;position:relative}.cal.mini .c.sel{border:2px solid #111}.cal.mini .c i{font-style:normal;font-weight:700;font-size:.7rem;background:var(--ac);color:#111;border-radius:99px;min-width:20px;padding:1px 5px}.cal.mini .c s{width:6px;height:6px;border-radius:99px;background:#111}
#agenda{margin-top:12px}.agh{font-size:1.05rem;margin:18px 0 8px;text-transform:none;font-family:inherit}.ag{display:flex;gap:12px;width:100%;text-align:left;font:inherit;color:#111;background:#fff;border:1px solid var(--line);border-left:5px solid var(--ac);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}.ag.requested{border-left-color:#bbb}.ag.blk{border-left-color:#111;background:#f4f4f4;cursor:default}.ag .t{min-width:64px}.ag .m{display:flex;flex-direction:column;gap:2px}.chip{display:inline-block;font-size:.75rem;border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin-right:4px;background:#faf8f1}.chip.paid,.chip.confirmed{background:#C5B358;border-color:#C5B358}
</style></head><body>
<div class="wrap"><h2>Coaches back office</h2>
<form id="login"><label>Your email<input id="em" type="email" required autocomplete="username"></label><label>4-digit PIN<input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required autocomplete="current-password"></label><button class="btn">Open</button><p class="note">First time? Use the setup link you were given.</p></form>
<div id="app" class="hide"><div class="bar"><b id="who"></b><button class="btn sm" id="csv">Export CSV</button><button class="btn sm lockbtn" id="out" title="Lock the back office when you are done">🔒 Lock</button></div>
<div class="bar tabs"><button class="btn sm" data-tab="t-cal">Calendar</button><button class="btn sm ghost" data-tab="t-list">Sign-ups</button><button class="btn sm ghost" data-tab="t-block">Block out time</button></div>
<div id="t-cal" class="tab"><div class="bar"><button class="btn sm ghost" id="prev">‹</button><b id="cal-title"></b><button class="btn sm ghost" id="next">›</button><button class="btn sm ghost" id="mode">Week view</button><span class="note" style="margin:0">Gold = confirmed, grey = requested. Click a session to confirm or reschedule.</span></div><div id="cal" class="cal"></div><div id="agenda"></div></div>
<div id="t-list" class="tab hide"><div class="tw"><table id="list"><thead><tr></tr></thead><tbody></tbody></table></div></div>
<div id="t-block" class="tab hide"><p class="note">Parents can request any day, start times 6 AM–8 PM (Denver). Block times you can't coach.</p>
<form id="addblock" class="bar"><input type="date" id="bd" required><input type="time" id="bs" step="3600" required><span>to</span><input type="time" id="be" step="3600" required><input id="bn" placeholder="Note (optional)" maxlength="200"><button class="btn sm">Block</button></form>
<div class="tw"><table id="blocks"><thead><tr><th>When</th><th>Note</th><th></th></tr></thead><tbody></tbody></table></div></div></div>
<dialog id="rq"><div id="rq-info"></div><div class="bar" style="margin-top:12px"><button class="btn sm" id="rq-ok">Confirm</button><button class="btn sm ghost" id="rq-no">Decline</button></div>
<p class="note">Reschedule to:</p><div class="bar"><input type="date" id="rq-date"><input type="time" id="rq-time" step="3600"><button class="btn sm" id="rq-move">Move &amp; confirm</button></div><button class="btn sm ghost" id="rq-x">Close</button></dialog>
<p id="msg" role="status"></p></div><script src="admin.js"></script></body></html>
