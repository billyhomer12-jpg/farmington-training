<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="icon" href="/favicon.svg?v=191" type="image/svg+xml"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Coach PIN setup</title><link rel="stylesheet" href="../style.css?v=191"><script src="../config.js?v=191"></script><style>.pinbig{text-align:center;font:600 1.8rem var(--font);letter-spacing:.6em;height:60px}body{background:var(--bg2)}.gnav-in>span:empty{display:none}.gnav .lockbtn,.gnav .btn.ghost{justify-self:end;width:auto!important;grid-column:2!important;grid-row:1!important;margin:0!important}@media(max-width:760px){.gnav-in{grid-template-rows:48px;padding:0 16px}.gnav .logo{padding-left:0}}</style></head><body>
<header class="gnav"><div class="gnav-in"><a href="../" class="logo"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" style="fill:var(--ac)"/><path d="M2 20h36M20 2v36M7 7c8 6 8 20 0 26M33 7c-8 6-8 20 0 26" stroke="#111" stroke-width="2.5" fill="none"/></svg><span class="brand">Back office</span></a><span></span><a class="btn sm ghost" href="./">Sign in</a></div></header>
<main><section class="hero dark sm-hero"><div class="wrap"><p class="kicker">Back office</p><h1>Set your PIN.</h1><p class="lead">One-time setup for coaches.</p></div></section>
<section class="sec alt" style="padding:28px 0 48px"><div class="wrap"><form id="f" class="card tile" style="max-width:420px;margin:0 auto;border-radius:28px;background:#fff;padding:28px;text-align:center">
<label>Email<input id="em" type="email" required></label><label>One-time setup code<input id="code" required autocomplete="off" style="text-transform:uppercase;text-align:center;letter-spacing:.2em"></label>
<label>New 4-digit PIN<input id="p1" class="pinbig" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required autocomplete="new-password"></label>
<label>Repeat PIN<input id="p2" class="pinbig" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required autocomplete="new-password"></label>
<button class="btn">Save PIN</button><p id="msg" role="status"></p></form></div></section></main>
<footer class="gfoot"><div class="wrap"><p class="legal"><b data-brand></b></p><p><a data-phone></a> · <a data-email href="mailto:fourcornershoopsandperformance@gmail.com">fourcornershoopsandperformance@gmail.com</a> · </p><p class="legal"><a href="../privacy.html">Privacy</a></p></div></footer>
<script>(()=>{const S=window.SITE,q=s=>document.querySelectorAll(s);q("[data-brand]").forEach(e=>e.textContent=S.brand);q("[data-phone]").forEach(e=>{e.textContent=S.phone;e.href="tel:"+(S.phoneTel||S.phone)});q("[data-email]").forEach(e=>{e.textContent=S.email;e.href="mailto:"+S.email})})();</script>
<script>
const S=window.SITE,$=i=>document.getElementById(i);$('em').value=new URLSearchParams(location.search).get('email')||'';
$('f').onsubmit=async e=>{e.preventDefault();if($('p1').value!==$('p2').value)return $('msg').textContent='PINs do not match.';
const r=await fetch(S.supabaseUrl+'/rest/v1/rpc/coach_set_pin',{method:'POST',headers:{apikey:S.supabaseKey,'Content-Type':'application/json'},body:JSON.stringify({p_email:$('em').value.trim().toLowerCase(),p_setup_code:$('code').value,p_new_pin:$('p1').value})});
const j=await r.json().catch(()=>({}));if(!r.ok||j.error)return $('msg').textContent=j.error||j.message||'Failed';
localStorage.setItem('coachEmail',$('em').value.trim().toLowerCase());$('msg').innerHTML='PIN saved, Coach '+j.name+'. <a href="./">Open the back office</a>'};
</script></body></html>
