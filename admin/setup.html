<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Coach PIN setup</title><link rel="stylesheet" href="../style.css?v=17"><script src="../config.js?v=17"></script></head><body>
<div class="wrap" style="max-width:420px;padding:32px 16px"><h2>Set your PIN</h2>
<form id="f"><label>Email<input id="em" type="email" required></label><label>One-time setup code<input id="code" required autocomplete="off" style="text-transform:uppercase"></label>
<label>New 4-digit PIN<input id="p1" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required autocomplete="new-password"></label>
<label>Repeat PIN<input id="p2" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required autocomplete="new-password"></label>
<button class="btn">Save PIN</button></form><p id="msg" role="status"></p></div>
<footer><div class="wrap"><b data-brand></b><p><a data-phone></a> · <a data-email></a> · <a data-ig>Instagram</a> · <a data-tt>TikTok</a></p></div></footer>
<script>(()=>{const S=window.SITE,q=s=>document.querySelectorAll(s);q("[data-brand]").forEach(e=>e.textContent=S.brand);q("[data-phone]").forEach(e=>{e.textContent=S.phone;e.href="tel:"+S.phone.replace(/\D/g,"")});q("[data-email]").forEach(e=>{e.textContent=S.email;e.href="mailto:"+S.email});q("[data-ig]").forEach(e=>e.href=S.instagram);q("[data-tt]").forEach(e=>e.href=S.tiktok)})();</script>
<script>
const S=window.SITE,$=i=>document.getElementById(i);$('em').value=new URLSearchParams(location.search).get('email')||'';
$('f').onsubmit=async e=>{e.preventDefault();if($('p1').value!==$('p2').value)return $('msg').textContent='PINs do not match.';
const r=await fetch(S.supabaseUrl+'/rest/v1/rpc/coach_set_pin',{method:'POST',headers:{apikey:S.supabaseKey,'Content-Type':'application/json'},body:JSON.stringify({p_email:$('em').value.trim().toLowerCase(),p_setup_code:$('code').value,p_new_pin:$('p1').value})});
const j=await r.json().catch(()=>({}));if(!r.ok||j.error)return $('msg').textContent=j.error||j.message||'Failed';
localStorage.setItem('coachEmail',$('em').value.trim().toLowerCase());$('msg').innerHTML='PIN saved, Coach '+j.name+'. <a href="./">Open the back office</a>'};
</script></body></html>
